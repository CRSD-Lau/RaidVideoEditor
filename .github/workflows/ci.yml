name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Quality and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check dependency lock
        run: uv lock --check

      - name: Install locked base and development dependencies
        run: uv sync --extra dev --frozen

      - name: Verify Python and installed dependencies
        run: |
          uv run --no-sync python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Type-check
        run: uv run --no-sync mypy src

      - name: Install verified FFmpeg 9.0.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Gyan release and independently published checksum:
          # https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.1-essentials_build.zip.sha256
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.1.zip'
          $toolsRoot = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.1'
          $expected = 'fec81ae03971d9dd4be3ebe02e263bd2ec1d789483f931bdba5f5715e65da2e9'
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.1/ffmpeg-9.0.1-essentials_build.zip' -OutFile $archive -MaximumRetryCount 3
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'FFmpeg archive checksum does not match the pinned release'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolsRoot
          $executables = @(Get-ChildItem -LiteralPath $toolsRoot -Filter ffmpeg.exe -File -Recurse)
          if ($executables.Count -ne 1) { throw 'Expected exactly one FFmpeg executable' }
          $bin = $executables[0].DirectoryName
          $probe = Join-Path $bin 'ffprobe.exe'
          if (-not (Test-Path -LiteralPath $probe -PathType Leaf)) { throw 'FFprobe is missing' }
          & $executables[0].FullName -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $probe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Generate synthetic raid fixture
        run: uv run --no-sync python scripts/generate-synthetic-fixture.py --force

      - name: Test
        run: uv run --no-sync pytest -q --junitxml "$env:RUNNER_TEMP/pytest-results.xml"

      - name: Require the synthetic CLI journey to run
        run: |
          [xml]$results = Get-Content -LiteralPath "$env:RUNNER_TEMP/pytest-results.xml" -Raw
          $journey = @($results.SelectNodes('//testcase') | Where-Object { $_.classname -like '*test_synthetic_cli_review_journey*' })
          if ($journey.Count -eq 0) { throw 'The synthetic CLI journey was not collected' }
          if (@($journey | Where-Object { $_.SelectSingleNode('skipped') }).Count -gt 0) {
            throw 'The synthetic CLI journey skipped instead of validating real media'
          }

      - name: Install locked optional CPU inference dependencies
        run: uv sync --extra dev --extra speech --extra intelligence --frozen

      - name: Verify optional imports without models or GPU
        run: |
          uv pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync python -c "import vosk, faster_whisper, numpy, huggingface_hub; print('Optional speech and intelligence imports passed; no models loaded')"

      - name: Validate native portrait review and export on synthetic media
        run: uv run --no-sync python scripts/smoke-native-portrait-highlights.py --output-dir "$env:RUNNER_TEMP/native-portrait-smoke"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
