project:
  name: "Pizza Warriors Raid"
  game: "World of Warcraft"
  expansion: "Wrath of the Lich King"
  raid: "Icecrown Citadel"
  raid_date: null

input:
  recording: "../samples/generated/synthetic-raid.mkv"
  combat_log: "../samples/generated/WoWCombatLog.txt"
  details_export: null
  skada_export: null
  manual_pulls: null

audio:
  microphone_track: null
  game_track: null
  discord_track: null
  mixed_track: null
  keep_game_audio: true
  keep_discord_audio: true
  remove_microphone: true

detection:
  minimum_pull_seconds: 2
  merge_gap_seconds: 2
  pre_roll_seconds: 1
  post_roll_seconds: 1
  confidence_threshold: 0.70
  combat_log_offset_seconds: 0
  recording_started_at: null

editing:
  include_trash_pulls: true
  include_boss_wipes: true
  include_boss_kills: true
  include_run_backs: false
  include_loot: true
  transition_duration_seconds: 0.4

music:
  library: "../music/music-library.json"
  approved_track_ids: []

preview:
  resolution: "1280x720"
  fps: 30
  bitrate: "4M"
  hardware_encoding: false
  watermark: null
  presentation: null

final:
  resolution: "source"
  fps: "source"
  codec: "h264"
  hardware_encoding: true
  constant_qp: 18
  preset: "p6"
  audio_bitrate: "320k"
