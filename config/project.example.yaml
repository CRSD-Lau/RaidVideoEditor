project:
  name: "Pizza Warriors Raid"
  game: "World of Warcraft"
  expansion: "Wrath of the Lich King"
  raid: "Icecrown Citadel"
  raid_date: null

input:
  recording: "../samples/generated/synthetic-raid.mkv"
  vertical_recording: null # Bind the matching Aitum recording before native highlight review.
  combat_log: "../samples/generated/WoWCombatLog.txt"
  details_export: null
  skada_export: null
  manual_pulls: null

audio:
  microphone_track: null
  game_track: null
  discord_track: null
  mixed_track: null
  keep_game_audio: true
  keep_discord_audio: false
  remove_microphone: true

detection:
  minimum_pull_seconds: 2
  merge_gap_seconds: 2
  pre_roll_seconds: 1
  post_roll_seconds: 1
  confidence_threshold: 0.70
  combat_log_offset_seconds: 0
  recording_started_at: null

difficulty:
  enabled: true
  raid_size: 25
  expected_bosses: 12
  overall_bosses_killed: null # optional guild result; never fills a recording/edit gap
  title_raid_abbreviation: "ICC"
  require_confirmed_for_auto_title: true

highlights:
  enabled: true
  manual_selection: null
  video_source: "native_vertical" # Older configs without this field keep landscape rendering.
  vertical_offset_hint_seconds: null # Search hint only; shared-audio verification is required.
  vertical_sync_audio_role: "game"
  review_clip_seconds: 45
  lead_in_seconds: 25
  lead_out_seconds: 15
  maximum_candidates: 12
  candidate_pool_size: 200
  maximum_routine_kills: 2
  minimum_spacing_seconds: 30
  fusion_window_seconds: 8
  minimum_score: 0.30
  discord_rms_threshold_db: -27
  game_rms_threshold_db: -20
  microphone_rms_threshold_db: -27
  relative_audio_energy: true
  motion_scene_threshold: 0.12
  motion_sample_fps: 2
  motion_keyframes_only: true
  include_kill_climaxes: true
  keep_game_audio: true
  keep_discord_audio: true
  keep_microphone_audio: false
  speech_triggers:
    enabled: false
    required: false
    backend: "vosk"
    model_path: null
    phrases: ["clip it"]
    source_roles: ["discord", "microphone"]
    minimum_word_confidence: 0.80
    maximum_word_gap_seconds: 0.50
    dedupe_seconds: 6
    maximum_matches: 50
    sample_rate_hz: 16000
  intelligence:
    enabled: false # New Friday configs enable this after local setup.
    required: false
    whisper_model_path: "../.models/faster-whisper-medium.en"
    whisper_device: "auto"
    whisper_compute_type: "int8"
    language: "en"
    ollama_url: "http://127.0.0.1:11435"
    ollama_executable: "../.tools/ollama-0.33.3/ollama.exe"
    ollama_models_path: "../.models/ollama"
    model: "qwen3.5:9b"
    chunk_seconds: 120
    overlap_seconds: 20
    maximum_chunks: 600
    request_timeout_seconds: 180
    minimum_score: 0.65
    maximum_candidates: 8
    minimum_clip_seconds: 12
    maximum_clip_seconds: 90
    visual_verification: true
    maximum_visual_candidates: 12
    feedback_path: "highlight-feedback.local.json"
  vertical_resolution: "1080x1920"
  hardware_encoding: true

preflight:
  enabled: true
  obs_profile_dir: "WoW_Raid_1440p60"
  obs_scene_collection_file: "WoW_Raid_Recording.json"
  expected_scene: "WoW Raid"
  expected_resolution: "2560x1440"
  expected_fps: 60
  require_vertical_recording: true
  aitum_config_file: "aitum.json"
  vertical_canvas_name: "Vertical"
  vertical_recording_output_name: "Vertical Raid Recording"
  vertical_expected_resolution: "1080x1920"
  vertical_recording_subdirectory: "Vertical"
  vertical_video_encoder: "obs_nvenc_h264_tex"
  vertical_rate_control: "CQP"
  vertical_quality: 18
  vertical_required_recording_tracks: [1, 2, 3, 4]
  minimum_free_space_gib: 150
  combat_log_max_age_minutes: 30
  require_fresh_combat_log: true
  smoke_recording_max_age_minutes: 30
  smoke_recording_min_seconds: 5
  smoke_recording_max_seconds: 120
  required_recording_tracks:
    1: "Full Mix"
    2: "WoW Game"
    3: "Discord"
    4: "Microphone"
  required_source_tracks:
    "WoW Audio": [1, 2]
    "Discord Audio": [1, 3]
    "Mic/Aux": [1, 4]
  required_scene_sources: ["WoW", "WebCam", "WebCam Border"]

editing:
  include_trash_pulls: true
  include_boss_wipes: true
  include_boss_kills: true
  include_run_backs: false
  include_loot: true
  transition_duration_seconds: 0.4

music:
  library: "../music/music-library.json"
  approved_track_ids: []

preview:
  resolution: "1280x720"
  fps: 30
  bitrate: "4M"
  hardware_encoding: true
  review_clip_mode: "full"
  # Individual boss/highlight browser proxies only. Final movies stay H.264.
  review_media_format: "webm"
  watermark:
    image: "../assets/pizza-warriors-lausudo-camera-cover-v1.png"
    x_fraction: 0.0
    y_fraction: 0.742
    width_fraction: 0.258
    height_fraction: 0.258
  presentation:
    theme: "icecrown_v2"
    background_image: "../assets/pizza-warriors-raid-presentation-v2-clean-1920x1080.png"
    intro_seconds: 5
    outro_seconds: 5
    intro_kicker: "WEEKLY RAID COVERAGE"
    intro_title: "ICECROWN CITADEL"
    intro_subtitle: "RAID DATE / 25 PLAYER RAID"
    outro_kicker: "FULL CLEAR"
    outro_title: "RAID COMPLETE"
    outro_subtitle: null
    boss_kicker: "PIZZA WARRIORS / ICECROWN CITADEL"

final:
  resolution: "source"
  fps: "source"
  codec: "h264"
  hardware_encoding: true
  constant_qp: 18
  preset: "p6"
  audio_bitrate: "320k"

youtube:
  enabled: false
  client_secrets: null
  token: null
  management_token: null
  analytics_token: null
  privacy_status: "private"
  category_id: "20"
  category_name: "Gaming"
  game_title: "World of Warcraft"
  game_rating: "Unrated"
  title: null
  description: null
  tags: []
  hashtags:
    - "#WorldOfWarcraft"
    - "#WotLK"
    - "#IcecrownCitadel"
  default_language: "en"
  made_for_kids: false
  age_restricted: false
  contains_synthetic_media: false
  license: "youtube"
  allow_embedding: true
  notify_subscribers: true
  api_project_verified_for_public: false
  forbid_em_dash: true
  chunk_size_mib: 16
  thumbnail_variants: 3
  selected_thumbnail_variant: 1
  playlist_auto_add: true
  playlist_id: null
  playlist_title: "Pizza Warriors Weekly ICC Clears"
  playlist_privacy_status: "public"
  analytics_enabled: true

archive:
  enabled: false
  destination: null
  include_raw_recording: true
  include_final_master: true
  include_project_artifacts: true
  require_public_1440p_verified: true
