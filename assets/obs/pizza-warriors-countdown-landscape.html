<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="author" content="Neil Mitchell">
    <meta name="last-modified-by" content="Neil Mitchell">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pizza Warriors 30 Minute Countdown - Landscape</title>
    <link rel="stylesheet" href="pizza-warriors-scenes.css">
  </head>
  <body>
    <main class="scene landscape" aria-label="Pizza Warriors raid countdown">
      <section class="countdown-card">
        <div class="countdown-content">
          <div class="countdown-copy">
            <div class="countdown-kicker">Raid begins in</div>
            <div class="countdown-subtitle">Pizza Warriors / Lordaeron</div>
          </div>
          <time class="countdown-value" data-countdown datetime="PT30M">30:00</time>
        </div>
      </section>
    </main>
    <script src="pizza-warriors-countdown.js"></script>
  </body>
</html>
